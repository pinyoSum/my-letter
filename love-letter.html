<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จดหมายถึงเธอ 💌</title>
<!-- ฟอนต์ (ต้องต่อเน็ต) ถ้าออฟไลน์จะใช้ฟอนต์สำรองอัตโนมัติ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Pridi:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   🎨 โทนสี — แก้สีทั้งเว็บได้ที่นี่ที่เดียว
   ============================================================ */
:root{
  --cream:  #FFF6EC;   /* กระดาษจดหมาย */
  --blush:  #FADADD;   /* ชมพูพาสเทล */
  --pink:   #F4B6C2;   /* ชมพูซอง */
  --rose:   #D9677C;   /* ชมพูกุหลาบอุ่น (สีเน้น) */
  --wine:   #7A2E40;   /* สีตัวอักษร */
  --shadow: rgba(122,46,64,.22);
  --hand: 'Mali', 'Sarabun', 'Tahoma', sans-serif;
  --serif:'Pridi', 'Sarabun', 'Tahoma', serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--hand); color:var(--wine); overflow:hidden;
  background:
    radial-gradient(circle at 20% 15%, #fff 0, transparent 40%),
    radial-gradient(circle at 85% 90%, var(--blush) 0, transparent 45%),
    var(--cream);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

/* ============================================================
   💌 ซองจดหมาย (หน้าแรก)
   ============================================================ */
.stage{height:100%;display:grid;place-items:center;align-content:center;gap:2.6rem;perspective:1000px;transition:opacity .7s}
.stage.gone{opacity:0;pointer-events:none}
.env{position:relative;width:min(84vw,360px);aspect-ratio:3/2;cursor:pointer;
  filter:drop-shadow(0 18px 24px var(--shadow));transition:transform .6s}
.env:hover{transform:translateY(-4px)}
.env:focus-visible{outline:3px solid var(--rose);outline-offset:8px;border-radius:8px}
.env > *{position:absolute;inset:0}
.env-back{background:var(--pink);border-radius:6px}
.env-paper{background:var(--cream);margin:6% 7%;border-radius:4px;transition:transform .9s .6s cubic-bezier(.3,.7,.2,1)}
.env-front{background:linear-gradient(160deg,#F9C6CF,var(--pink));border-radius:6px;
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env-flap{height:56%;bottom:auto;background:linear-gradient(#EFA3B2,var(--pink));
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:4;
  transition:transform .8s ease, z-index 0s .4s}
.seal{inset:auto;left:50%;top:56%;width:54px;height:54px;margin:-27px 0 0 -27px;z-index:5;
  border-radius:50%;display:grid;place-items:center;color:#fff;font-size:24px;
  background:radial-gradient(circle at 35% 30%,#EE8C9E,var(--rose) 60%,#A8465A);
  box-shadow:0 3px 8px var(--shadow), inset 0 -3px 5px rgba(0,0,0,.18);
  animation:beat 1.8s ease-in-out infinite;transition:opacity .4s}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.env.open .env-flap{transform:rotateX(180deg);z-index:1}
.env.open .env-paper{transform:translateY(-62%)}
.env.open .seal{opacity:0;animation:none}
.hint{font-size:1.1rem;text-align:center;line-height:1.7}

/* ============================================================
   📜 กระดาษจดหมาย
   ============================================================ */
.letter-wrap{position:fixed;inset:0;overflow-y:auto;display:none;padding:28px 16px 60px;z-index:5}
.letter-wrap.show{display:block}
.letter{
  max-width:540px;margin:0 auto;padding:40px 28px 36px;border-radius:6px;
  background:repeating-linear-gradient(transparent 0 33px,rgba(217,103,124,.13) 33px 34px),var(--cream);
  box-shadow:0 24px 50px var(--shadow);
  transform-origin:top center;animation:unfold 1.1s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes unfold{
  from{opacity:0;transform:perspective(1100px) rotateX(-75deg) translateY(40px)}
  to  {opacity:1;transform:perspective(1100px) rotateX(0) translateY(0)}
}
.to{font-family:var(--serif);font-size:1.7rem;font-weight:600;color:var(--rose);margin-bottom:1rem}
.letter p{line-height:34px;font-size:1.05rem;margin-bottom:34px}
.sign{text-align:right;font-family:var(--serif);font-size:1.15rem}

/* คำถาม + ปุ่ม */
.ask{font-family:var(--serif);font-size:clamp(1.7rem,7vw,2.3rem);text-align:center;color:var(--rose);margin:10px 0 24px;line-height:1.4}
.btns{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:18px;min-height:90px}
button{font-family:var(--hand);border:0;cursor:pointer;border-radius:999px;color:#fff}
.yes{--g:0;font-size:calc(1.1rem + var(--g) * .22rem);padding:.7em 1.8em;font-weight:600;
  background:linear-gradient(135deg,#EE8C9E,var(--rose));box-shadow:0 8px 18px var(--shadow);
  transition:font-size .35s cubic-bezier(.3,1.6,.5,1), transform .2s}
.yes:hover{transform:scale(1.05)}
.yes.huge{position:fixed;inset:0;z-index:20;border-radius:0;font-size:min(14vw,5rem)}
.no{font-size:1rem;padding:.65em 1.4em;background:#B9A4A8;transition:transform .35s cubic-bezier(.3,1.4,.5,1);touch-action:none}
button:focus-visible{outline:3px solid var(--wine);outline-offset:3px}

/* ============================================================
   🎉 ป๊อปอัป + คอนเฟตติ + ปุ่มเพลง
   ============================================================ */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:20px;background:rgba(122,46,64,.35)}
.modal.show{display:grid}
.card{background:var(--cream);border-radius:22px;padding:34px 28px;text-align:center;max-width:340px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.card .big{font-size:3.4rem;animation:beat 1.2s infinite}
.card h2{font-family:var(--serif);font-size:1.9rem;color:var(--rose);margin:.4rem 0}
.card p{line-height:1.7;margin-bottom:1.2rem}
.card button{background:var(--rose);padding:.6em 1.6em;font-size:1rem}
.music{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:60;width:44px;height:44px;
  padding:0;font-size:1.2rem;background:rgba(255,255,255,.85);color:var(--rose);box-shadow:0 3px 10px var(--shadow)}
.music.off{opacity:.55}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>

<body>

<button class="music off" id="music" aria-label="เปิด/ปิดเพลง" title="เปิด/ปิดเพลง">♪</button>

<!-- หน้าแรก: ซองจดหมาย -->
<main class="stage" id="stage">
  <div class="env" id="env" role="button" tabindex="0" aria-label="เปิดจดหมาย">
    <div class="env-back"></div>
    <div class="env-paper"></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="seal">♥</div>
  </div>
  <!-- ✏️ แก้ข้อความใต้ซองตรงนี้ -->
  <p class="hint">มีจดหมายถึงคุณ...<br>กดเพื่อเปิด</p>
</main>

<!-- จดหมาย (ถูกสร้างจากค่า CONFIG ด้านล่าง) -->
<div class="letter-wrap" id="letterWrap">
  <article class="letter">
    <h1 class="to" id="to"></h1>
    <div id="body"></div>
    <p class="sign" id="sign"></p>
    <h2 class="ask" id="ask"></h2>
    <div class="btns" id="btns">
      <button class="yes" id="yes"></button>
      <button class="no" id="no"></button>
    </div>
  </article>
</div>

<!-- ป๊อปอัปตอบรับ -->
<div class="modal" id="modal">
  <div class="card" role="dialog" aria-modal="true">
    <div class="big">❤️</div>
    <h2 id="thanksTitle"></h2>
    <p id="thanksText"></p>
    <button id="close">ปิด</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
/* ============================================================
   ✏️ CONFIG — แก้ข้อความ รูป และเพลง ได้ที่นี่ที่เดียว
   ============================================================ */
const CONFIG = {
  herName: "น้องเกดเด็กน้อยของพี่...",                       // ← ใส่ชื่อเธอ  (จะแสดงเป็น "ถึง ...")
  paragraphs: [                          // ← แต่ละบรรทัดคือ 1 ย่อหน้า เพิ่ม/ลบได้
    "ขอบคุณที่เข้ามาเป็นเรื่องราวดีๆ ในชีวิตพี่นะครับ พี่ดีใจมากๆ ที่ได้เจอน้องเกด แม้จะมีช่วงที่ไม่เข้าใจกันบ้าง แต่พี่ก็พร้อมที่จะปรับและเรียนรู้ไปพร้อมกับน้องเกดเสมอนะ",
    "วันนี้พี่เลยอยากถามน้องเกดคำถามหนึ่ง..."
  ],
  signature: "จากคนที่รักน้องเกดที่สุด ♥",       // ← ลายเซ็นท้ายจดหมาย
  question: "เป็นแฟนกับพี่นะครับ🌹",           // ← คำถามสำคัญ
  yesText: "ตกลง 💖",            // ← ข้อความปุ่มตอบรับ
  noTexts: [                             // ← ข้อความปุ่มปฏิเสธ จะเปลี่ยนไปเรื่อยๆ ทุกครั้งที่หนี
    "ขอคิดดูก่อน", "แน่ใจนะ?", "คิดดีๆ อีกที", "ลองอีกทีสิ", "อย่าใจร้ายสิ", "ไม่เอา 🥺"
  ],
  thanksTitle: "ขอบคุณนะ! ❤️",           // ← หัวข้อป๊อปอัป
  thanksText:  "ต่อจากนี้ไปพี่ขอดูแลน้องเกดให้ดีที่สุดนะ",
  musicUrl: "jigsaw.mp3"                           // ← ใส่ไฟล์เพลง เช่น "song.mp3" (ว่าง = ใช้ทำนองกล่องดนตรีในตัว)
};

/* ============================================================
   เติมเนื้อหาลงหน้าเว็บ
   ============================================================ */
const $ = id => document.getElementById(id);
$('to').textContent = "ถึง " + CONFIG.herName;
$('body').innerHTML = CONFIG.paragraphs.map(t => `<p>${t}</p>`).join('');
$('sign').textContent = CONFIG.signature;
$('ask').textContent = CONFIG.question;
$('yes').textContent = CONFIG.yesText;
$('no').textContent = CONFIG.noTexts[0];
$('thanksTitle').textContent = CONFIG.thanksTitle;
$('thanksText').textContent = CONFIG.thanksText;

/* ============================================================
   💌 เปิดซอง → จดหมายคลี่ออก
   ============================================================ */
const env = $('env');
function openEnvelope(){
  if (env.classList.contains('open')) return;
  env.classList.add('open');
  startMusic();                                   // เริ่มเพลงหลังผู้ใช้กด (เบราว์เซอร์บังคับ)
  setTimeout(() => $('stage').classList.add('gone'), 1700);
  setTimeout(() => { $('letterWrap').classList.add('show'); $('stage').style.display = 'none'; }, 2300);
}
env.addEventListener('click', openEnvelope);
env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); } });

/* ============================================================
   😈 ปุ่ม "ไม่เอา": หนีเมาส์/นิ้ว และทำให้ปุ่ม "ตกลง" ใหญ่ขึ้นเรื่อยๆ
   ============================================================ */
const yes = $('yes'), no = $('no');
let dodges = 0;
const HUGE_AT = 12;                               // ← หนีครบกี่ครั้งปุ่มตกลงจะเต็มจอ (แก้ได้)

function growYes(step = 1){
  dodges += step;
  yes.style.setProperty('--g', Math.min(dodges, 8));        // ขยายสูงสุด 8 ระดับก่อนเต็มจอ
  no.textContent = CONFIG.noTexts[Math.min(dodges, CONFIG.noTexts.length - 1)];
  if (dodges >= HUGE_AT) yes.classList.add('huge');
}
function dodge(){
  no.style.transform = 'none';                    // รีเซ็ตเพื่ออ่านตำแหน่งตั้งต้น
  const base = no.getBoundingClientRect(), m = 10;
  const x = m + Math.random() * (innerWidth  - base.width  - 2 * m);
  const y = m + Math.random() * (innerHeight - base.height - 2 * m);
  no.style.transform = `translate(${x - base.left}px, ${y - base.top}px)`;
  growYes();
}
no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') dodge(); });
no.addEventListener('touchstart', e => { e.preventDefault(); dodge(); }, { passive: false });
no.addEventListener('click', () => { dodge(); growYes(2); });   // กดด้วยคีย์บอร์ดก็ไม่รอด

/* ============================================================
   🎉 กด "ตกลง" → คอนเฟตติ + ป๊อปอัป
   ============================================================ */
yes.addEventListener('click', () => {
  yes.classList.remove('huge');
  no.style.display = 'none';
  $('modal').classList.add('show');
  burst();
});
$('close').addEventListener('click', () => $('modal').classList.remove('show'));

/* คอนเฟตติ (วาดบน canvas) */
const cv = $('confetti'), ctx = cv.getContext('2d');
const COLORS = ['#F4B6C2','#D9677C','#FADADD','#FFD6A5','#fff','#EE8C9E'];
let parts = [], raf = null;
function resize(){ const r = devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r; ctx.setTransform(r,0,0,r,0,0); }
addEventListener('resize', resize); resize();

function spawn(n){
  for (let i = 0; i < n; i++){
    const left = Math.random() < .5;
    parts.push({
      x: left ? 0 : innerWidth, y: innerHeight * .65,
      vx: (left ? 1 : -1) * (4 + Math.random() * 9), vy: -(8 + Math.random() * 12),
      s: 6 + Math.random() * 8, a: Math.random() * 6, va: (Math.random() - .5) * .35,
      c: COLORS[Math.random() * COLORS.length | 0], heart: Math.random() < .35, life: 0
    });
  }
}
function drawHeart(s){
  ctx.beginPath(); ctx.moveTo(0, s * .35);
  ctx.bezierCurveTo(-s, -s * .3, -s * .3, -s, 0, -s * .4);
  ctx.bezierCurveTo(s * .3, -s, s, -s * .3, 0, s * .35); ctx.fill();
}
function tick(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  parts.forEach(p => {
    p.vy += .28; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life++;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
    ctx.globalAlpha = Math.max(0, 1 - p.life / 220);
    p.heart ? drawHeart(p.s) : ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    ctx.restore();
  });
  parts = parts.filter(p => p.life < 220 && p.y < innerHeight + 40);
  raf = parts.length ? requestAnimationFrame(tick) : (ctx.clearRect(0,0,innerWidth,innerHeight), null);
}
function burst(){
  let rounds = 0;
  const t = setInterval(() => { spawn(70); if (++rounds === 4) clearInterval(t); }, 350);  // ยิงต่อเนื่อง 4 รอบ
  if (!raf) raf = requestAnimationFrame(tick);
  const keep = setInterval(() => { if (!raf && parts.length) raf = requestAnimationFrame(tick); if (rounds >= 4) clearInterval(keep); }, 200);
}

/* ============================================================
   🎵 เพลงพื้นหลัง
   - ถ้าใส่ CONFIG.musicUrl จะเล่นไฟล์ของคุณ
   - ถ้าเว้นว่าง จะเล่นทำนองกล่องดนตรีที่สร้างในโค้ด (ไม่ต้องมีไฟล์)
   ============================================================ */
const musicBtn = $('music');
let playing = false, audio = null, ac = null, timer = null, step = 0;
const MELODY = [523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,
                659.25,783.99,1046.5,783.99,587.33,659.25,523.25,392];

function note(freq){
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t + 1.1);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 1.2);
}
function startMusic(){
  if (playing) return;
  playing = true; musicBtn.classList.remove('off');
  if (CONFIG.musicUrl){
    audio = audio || Object.assign(new Audio(CONFIG.musicUrl), { loop: true, volume: .6 });
    audio.play().catch(() => { playing = false; musicBtn.classList.add('off'); });
  } else {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    ac.resume();
    timer = setInterval(() => note(MELODY[step++ % MELODY.length]), 480);
  }
}
function stopMusic(){
  playing = false; musicBtn.classList.add('off');
  if (audio) audio.pause();
  clearInterval(timer);
}
musicBtn.addEventListener('click', () => playing ? stopMusic() : startMusic());
</script>
</body>
</html>
